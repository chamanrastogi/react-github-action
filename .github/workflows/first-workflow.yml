name: first-workflow

on:
  push:
  pull_request:

jobs:
  first-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: run eslist in app
        run: npm run lint

      - name: runTest cases
        run: npm run test

      - name: Build project
        run: npm run build
