name: first-workflow

on:
  push:
  pull_request:

jobs:
  lint-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: run eslist in app
        run: npm run lint

  test-job:
    needs: [lint-job]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build-job:
    needs: [lint-job, test-job]
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: "${{ secrets.VERCEL_ORG_ID }}"
      VERCEL_PROJECT_ID: "${{ secrets.VERCEL_PROJECT_ID }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: react-build
          path: dist/
          retention-days: 7

      - name: "Install Vercel Cli"
        run: npm install --global vercel

      - name: Delopment on Vercel
        run: vercel deploy dist --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
